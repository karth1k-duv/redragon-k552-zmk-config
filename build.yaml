include:
  - board: adafruit_feather_nrf52840
    shield: feather17x6
    artifact-name: feather17x6-studio
    snippet: studio-rpc-usb-uart
    cmake-args:
      - -DCONFIG_ZMK_STUDIO=y

  # Temporary hardware bring-up build. Flash this while validating the
  # 6x17 matrix: USB logging prints the row/column generated by each key.
  - board: adafruit_feather_nrf52840
    shield: feather17x6
    artifact-name: feather17x6-bringup
    snippet: zmk-usb-logging
    cmake-args:
      - -DCONFIG_ZMK_STUDIO=n
      - -DCONFIG_ZMK_LOG_LEVEL=4
